<style>
:root{--bg:#fbf6ef;--card:#fff;--tx:#2a1f17;--mu:#7a6a5c;--pr:#c2410c;--onp:#fff;--pl:#ffe9d6;--bd:#eadfd2;--ok:#15803d;--okb:#dcfce7;--wa:#b45309;--wab:#fef3c7;--ba:#b91c1c;--bab:#fee2e2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18120d;--card:#231b14;--tx:#f8f1ea;--mu:#b9a898;--pr:#fb923c;--onp:#2a1204;--pl:#3a2a1c;--bd:#43342a;--ok:#4ade80;--okb:#143323;--wa:#fbbf24;--wab:#3a2c0e;--ba:#f87171;--bab:#3d1a1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18120d;--card:#231b14;--tx:#f8f1ea;--mu:#b9a898;--pr:#fb923c;--onp:#2a1204;--pl:#3a2a1c;--bd:#43342a;--ok:#4ade80;--okb:#143323;--wa:#fbbf24;--wab:#3a2c0e;--ba:#f87171;--bab:#3d1a1a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{max-width:560px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--pr);color:var(--onp);display:grid;place-items:center;font-size:20px}
header b{font-size:20px}header small{display:block;color:var(--mu);font-size:12px;margin-top:-2px}
main{max-width:560px;margin:0 auto;padding:8px 18px 110px}
h1{font-size:24px;margin:14px 0 8px}h2{font-size:15px;margin:20px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}h3{margin:0 0 12px;font-size:19px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:6px 2px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;cursor:pointer}
nav button span{font-size:20px}nav button.on{color:var(--pr);background:var(--pl);font-weight:600}
.card,.row,.hero,.fc,.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px}
.card{padding:14px;margin:10px 0}
.hero{padding:18px;background:var(--pr);color:var(--onp);border:0}.hero h1{margin:0 0 4px}.hero p{margin:0 0 12px}.hero small{opacity:.9}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:8px 0}
.row .g{flex:1;min-width:0}.row b{display:block;overflow-wrap:anywhere}.row small,small,.mu{color:var(--mu);font-size:13px}
.hero small{color:inherit}
.row.dn b{text-decoration:line-through;opacity:.6}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--pr);background:none;color:var(--onp);cursor:pointer;flex:none;font-size:16px;display:grid;place-items:center;padding:0}
.dn .chk{background:var(--pr)}
.chip{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;flex:none}
.palta{background:var(--bab);color:var(--ba)}.pmedia{background:var(--wab);color:var(--wa)}.pbaja{background:var(--okb);color:var(--ok)}
.late{color:var(--ba)!important}
.ic{border:0;background:none;font-size:17px;cursor:pointer;padding:6px;border-radius:10px;color:var(--tx)}
.ic:hover{background:var(--pl)}
.btn{border:0;background:var(--pr);color:var(--onp);font:inherit;font-weight:600;padding:11px 16px;border-radius:14px;cursor:pointer}
.btn.s{background:var(--pl);color:var(--pr)}.btn.ok{background:var(--ok);color:var(--card)}.btn.wa{background:var(--wa);color:var(--card)}.btn.bad{background:var(--ba);color:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bar .btn{flex:1}
.prog{height:10px;border-radius:99px;background:var(--pl);overflow:hidden}.prog i{display:block;height:100%;background:var(--pr);border-radius:99px;transition:width .3s}
.hero .prog{background:rgba(255,255,255,.3)}.hero .prog i{background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}.stat b{font-size:26px;color:var(--pr);display:block}.stat span{font-size:13px;color:var(--mu)}
label{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:10px 0}
input:not([type=radio]),select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr)}
.opt{display:flex;align-items:center;gap:8px;margin:6px 0}.opt input[type=radio]{accent-color:var(--pr);width:20px;height:20px;flex:none}.opt input:not([type=radio]){margin:0}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ans{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;font:inherit;cursor:pointer}
.ans.sel{border-color:var(--pr);background:var(--pl)}
.ans.good{border-color:var(--ok);background:var(--okb)}.ans.wrong{border-color:var(--ba);background:var(--bab)}
.qt{margin:0 0 6px;font-size:19px;text-transform:none;letter-spacing:0;color:var(--tx)}
.fc{min-height:190px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;cursor:pointer;border:2px solid var(--pr)}
.fc p{font-size:20px;font-weight:600;margin:12px 0;overflow-wrap:anywhere}.fc.back{background:var(--pl)}
.cr{text-align:center;color:var(--mu);font-size:13px;margin:28px 0 0}
.empty{color:var(--mu);text-align:center;padding:16px;border:1px dashed var(--bd);border-radius:16px;margin:8px 0}
.big{font-size:44px;font-weight:800;color:var(--pr);text-align:center;margin:4px 0}
details{margin:10px 0}summary{cursor:pointer;color:var(--pr);font-weight:600;font-size:14px}
.err{color:var(--ba);font-size:14px;min-height:20px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
</style>
</head>
<body>
<header><div class="logo">🎓</div><div><b>StudyFlow</b><small>Creada por Jesús Crespo</small></div><button class="ic" id="th" aria-label="Cambiar tema claro u oscuro" style="margin-left:auto;font-size:20px">🌓</button></header>
<main id="main"><noscript>StudyFlow: app gratuita para estudiar con planificador de tareas y exámenes, tests, tarjetas de memoria y seguimiento del progreso. Creada por Jesús Crespo. Activa JavaScript para usarla.</noscript></main>
<nav><div id="nav"></div></nav>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const KEY='studyflow:v1';
const PO={alta:0,media:1,baja:2},PN={alta:'Alta',media:'Media',baja:'Baja'};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const dfmt=s=>s?new Date(s+'T00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}):'Sin fecha';
const left=s=>{const n=Math.round((new Date(s+'T00:00')-new Date(today()+'T00:00'))/864e5);return n<0?'Pasado':n===0?'Hoy':n===1?'Mañana':'En '+n+' días'};
const byDue=(a,b)=>(a.due||'9').localeCompare(b.due||'9')||PO[a.prio]-PO[b.prio];
const empty=t=>'<p class="empty">'+t+'</p>';
const blankQ=()=>({q:'',o:['','','',''],c:0});

const demo=()=>({v:2,tasks:[],exams:[],quizzes:[],results:[],cards:[],reviewed:0});
let S,FS=null;
const ui={tab:'home',play:null,draft:null,ci:0,flip:false};
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.tasks){S=d;migrate();return}}}catch(e){}S=demo();save()}
function migrate(){if(S.v>=2)return;const dt=['Resolver ejercicios del tema 4','Leer capítulo 2','Entregar resumen de laboratorio'],dq=['Cultura general (ejemplo)'],dc=['¿Qué es la fotosíntesis?','Teorema de Pitágoras','¿En qué año llegó Colón a América?'];
S.tasks=S.tasks.filter(t=>!dt.includes(t.title));S.quizzes=S.quizzes.filter(q=>!dq.includes(q.title));S.results=S.results.filter(r=>!dq.includes(r.title));S.cards=S.cards.filter(c=>!dc.includes(c.q));S.v=2;save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- modal helpers ---------- */
function modal(h){const m=$('#modal');m.innerHTML='<div class="sheet">'+h+'</div>';m.classList.add('on')}
function closeM(){const m=$('#modal');m.classList.remove('on');m.innerHTML='';FS=null}
function form(title,fields,vals,onSave){
 const inp=f=>{const raw=vals[f.n]!=null?vals[f.n]:(f.d||''),v=esc(raw);
  const i=f.t==='select'?'<select name="'+f.n+'">'+f.o.map(([k,l])=>'<option value="'+k+'"'+(k===raw?' selected':'')+'>'+l+'</option>').join('')+'</select>'
   :f.t==='area'?'<textarea name="'+f.n+'" rows="3">'+v+'</textarea>'
   :'<input name="'+f.n+'" type="'+f.t+'" value="'+v+'">';
  return '<label>'+f.l+i+'</label>'};
 modal('<h3>'+title+'</h3>'+fields.map(inp).join('')+'<div class="err" id="err"></div><div class="bar"><button class="btn" data-a="fsave">Guardar</button><button class="btn s" data-a="fcancel">Cancelar</button></div>');
 FS=()=>{const v={};document.querySelectorAll('#modal [name]').forEach(e=>v[e.name]=e.value.trim());const er=onSave(v);if(er){$('#err').textContent=er;return}save();closeM();render()};
}
function ask(msg,fn,lab){
 modal('<h3>'+msg+'</h3><div class="bar"><button class="btn bad" data-a="fsave">'+(lab||'Sí, eliminar')+'</button><button class="btn s" data-a="fcancel">Cancelar</button></div>');
 FS=()=>{fn();save();closeM();render()};
}

/* ---------- forms ---------- */
function taskForm(id){const t=id?S.tasks.find(x=>x.id===id):{prio:'media'};
 form(id?'Editar tarea':'Nueva tarea',[
  {n:'title',l:'Título',t:'text'},{n:'subject',l:'Asignatura',t:'text'},{n:'due',l:'Fecha límite',t:'date'},
  {n:'prio',l:'Prioridad',t:'select',o:[['alta','Alta'],['media','Media'],['baja','Baja']]}],t,v=>{
  if(!v.title)return'Escribe un título para la tarea.';
  if(id)Object.assign(t,v);else S.tasks.push(Object.assign({id:uid(),done:false},v));});}
function examForm(id){const e=id?S.exams.find(x=>x.id===id):{date:plus(7)};
 form(id?'Editar examen':'Nuevo examen',[{n:'subject',l:'Asignatura',t:'text'},{n:'date',l:'Fecha',t:'date'}],e,v=>{
  if(!v.subject)return'Escribe la asignatura.';if(!v.date)return'Elige una fecha.';
  if(id)Object.assign(e,v);else S.exams.push(Object.assign({id:uid()},v));});}
function decksel(){const ds=[...new Set(S.cards.map(c=>c.deck).filter(Boolean))];return ds.length?'<label>Mazo<select id="dsel"><option value="">Todos</option>'+ds.map(d=>'<option'+(d===ui.deck?' selected':'')+'>'+esc(d)+'</option>').join('')+'</select></label>':''}
document.addEventListener('change',e=>{if(e.target.id==='dsel'){ui.deck=e.target.value;ui.ci=0;ui.flip=false;render()}});
function say(){const c=cq()[ui.ci];if(!c||!window.speechSynthesis)return toast('Tu navegador no puede leer en voz alta.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(ui.flip?c.a:c.q);u.lang='es-ES';speechSynthesis.speak(u)}
function shareQuiz(id){const q=S.quizzes.find(x=>x.id===id),tx=q.questions.map(x=>x.q+'\n'+x.o.map((o,j)=>'abcd'[j]+') '+o).join('\n')+'\nRespuesta: '+'abcd'[x.c]).join('\n\n');
 modal('<h3>Compartir «'+esc(q.title)+'»</h3><p class="mu" style="font-size:13px">Copia este texto y envíalo (WhatsApp, Notas…). Quien lo reciba puede pegarlo en Tests → ⚡ Automático → Importar preguntas ya escritas.</p><textarea id="ta" rows="9" readonly>'+esc(tx)+'</textarea><div class="bar"><button class="btn" data-a="cp">Copiar</button><button class="btn s" data-a="fcancel">Cerrar</button></div>')}
function cardForm(id){const c=id?S.cards.find(x=>x.id===id):{};
 form(id?'Editar tarjeta':'Nueva tarjeta',[{n:'q',l:'Pregunta (delante)',t:'area'},{n:'a',l:'Respuesta (detrás)',t:'area'},{n:'deck',l:'Mazo o asignatura (opcional)',t:'text'}],c,v=>{
  if(!v.q||!v.a)return'Rellena la pregunta y la respuesta.';
  if(id)Object.assign(c,v);else S.cards.push({id:uid(),q:v.q,a:v.a,deck:v.deck,known:null});});}

/* ---------- views ---------- */
const actions=(k,id)=>'<button class="ic" aria-label="Editar" data-a="edit'+k+'" data-id="'+id+'">✏️</button><button class="ic" aria-label="Eliminar" data-a="del'+k+'" data-id="'+id+'">🗑</button>';
const taskRow=t=>'<div class="row'+(t.done?' dn':'')+'"><button class="chk" aria-label="Completar" data-a="toggle" data-id="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="g"><b>'+esc(t.title)+'</b><small class="'+(!t.done&&t.due&&t.due<today()?'late':'')+'">'+esc(t.subject||'Sin asignatura')+' · '+dfmt(t.due)+'</small></div><span class="chip p'+t.prio+'">'+PN[t.prio]+'</span>'+actions('Task',t.id)+'</div>';
const examRow=e=>'<div class="row"><span style="font-size:22px">📝</span><div class="g"><b>'+esc(e.subject)+'</b><small>'+dfmt(e.date)+' · '+left(e.date)+'</small></div>'+actions('Exam',e.id)+'</div>';
function stats(){const dn=S.tasks.filter(t=>t.done).length,n=S.results.length,avg=n?Math.round(S.results.reduce((a,r)=>a+r.score/r.total,0)/n*100)+'%':'—';
 return '<div class="grid"><div class="stat"><b>'+dn+'/'+S.tasks.length+'</b><span>Tareas completadas</span></div><div class="stat"><b>'+n+'</b><span>Tests realizados</span></div><div class="stat"><b>'+avg+'</b><span>Nota media en tests</span></div><div class="stat"><b>'+S.reviewed+'</b><span>Tarjetas repasadas</span></div><div class="stat"><b>'+streak()+' 🔥</b><span>Días seguidos</span></div><div class="stat"><b>'+weekMins()+'</b><span>Min. estudiados (7 días)</span></div></div>'}

function home(){const h=new Date().getHours(),g=h<13?'Buenos días':h<20?'Buenas tardes':'Buenas noches';
 const pend=S.tasks.filter(t=>!t.done).sort(byDue),dn=S.tasks.length-pend.length,pct=S.tasks.length?Math.round(dn/S.tasks.length*100):0;
 const ex=S.exams.filter(e=>e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
 return '<div class="hero" style="margin-top:12px"><h1>'+g+' 👋</h1><p>'+(pend.length?'Tienes '+pend.length+(pend.length>1?' tareas pendientes.':' tarea pendiente.'):'No tienes tareas pendientes. ¡Buen trabajo!')+'</p><div class="prog"><i style="width:'+pct+'%"></i></div><small>'+pct+'% de tus tareas completadas</small></div>'
 +welcome()+timerCard()+'<h2>Tareas pendientes</h2>'+(pend.slice(0,5).map(taskRow).join('')||empty('Nada pendiente. Añade tareas en el Planificador.'))
 +'<h2>Próximos exámenes</h2>'+(ex.map(examRow).join('')||empty('No hay exámenes próximos.'))
 +'<h2>Resumen</h2>'+stats()}

function planner(){const pend=S.tasks.filter(t=>!t.done).sort(byDue),dn=S.tasks.filter(t=>t.done),ex=[...S.exams].sort((a,b)=>a.date.localeCompare(b.date));
 return '<h1>Planificador</h1><div class="bar"><button class="btn" data-a="newTask">+ Tarea</button><button class="btn s" data-a="newExam">+ Examen</button></div>'
 +'<h2>Pendientes ('+pend.length+')</h2>'+(pend.map(taskRow).join('')||empty('No tienes tareas pendientes.'))
 +'<h2>Exámenes ('+ex.length+')</h2>'+(ex.map(examRow).join('')||empty('Sin exámenes añadidos.'))
 +'<h2>Completadas ('+dn.length+')</h2>'+(dn.map(taskRow).join('')||empty('Aún no has completado ninguna tarea.'))}

function tests(){
 if(ui.play)return playView();
 if(ui.draft)return quizEdit();
 return '<h1>Tests</h1><div class="bar"><button class="btn" data-a="newQuiz">+ Nuevo test</button><button class="btn s" data-a="auto">⚡ Automático</button></div>'
 +(S.quizzes.map(q=>{const last=[...S.results].reverse().find(r=>r.quizId===q.id);
  return '<div class="card"><b>'+esc(q.title)+'</b><br><small>'+q.questions.length+' pregunta'+(q.questions.length===1?'':'s')+(last?' · Último: '+last.score+'/'+last.total:'')+'</small><div class="bar"><button class="btn" data-a="playQuiz" data-id="'+q.id+'"'+(q.questions.length?'':' disabled')+'>Hacer test</button><button class="btn s" data-a="editQuiz" data-id="'+q.id+'">Editar</button><button class="btn s" data-a="shareQuiz" data-id="'+q.id+'">Compartir</button><button class="btn s" data-a="delQuiz" data-id="'+q.id+'">Borrar</button></div></div>'}).join('')||empty('Todavía no hay tests. Crea uno con «+ Nuevo test» o genera uno desde tus apuntes con «⚡ Automático».'))}

function quizEdit(){const d=ui.draft;
 return '<h1>'+(d.isNew?'Nuevo test':'Editar test')+'</h1><label>Título del test<input data-f="title" value="'+esc(d.title)+'" placeholder="Ej. Tema 3 de Biología"></label>'
 +d.questions.map((q,i)=>'<div class="card"><div class="qh"><b>Pregunta '+(i+1)+'</b><button class="ic" aria-label="Quitar pregunta" data-a="delQ" data-id="'+i+'">🗑</button></div><textarea data-f="q" data-i="'+i+'" rows="2" placeholder="Escribe la pregunta">'+esc(q.q)+'</textarea>'
  +q.o.map((o,j)=>'<div class="opt"><input type="radio" name="c'+i+'" aria-label="Correcta" data-f="c" data-i="'+i+'" data-j="'+j+'"'+(q.c===j?' checked':'')+'><input data-f="o" data-i="'+i+'" data-j="'+j+'" value="'+esc(o)+'" placeholder="Respuesta '+(j+1)+'"></div>').join('')
  +'<small>Marca el círculo de la respuesta correcta.</small></div>').join('')
 +'<div class="bar"><button class="btn s" data-a="addQ">+ Añadir pregunta</button></div><div class="err" id="err2"></div><div class="bar"><button class="btn" data-a="saveQuiz">Guardar test</button><button class="btn s" data-a="cancelDraft">Cancelar</button></div>'}

function playView(){const p=ui.play,qs=p.quiz.questions,n=qs.length;
 if(p.done){const pct=Math.round(p.score/n*100);
  return '<h1>Resultado</h1><div class="card"><div class="big">'+p.score+' / '+n+'</div><p style="text-align:center;margin:0">'+pct+'% de aciertos · '+(pct>=80?'¡Excelente!':pct>=50?'Buen trabajo, sigue practicando.':'Repasa y vuelve a intentarlo.')+'</p></div><h2>Respuestas correctas</h2>'

function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mkQs(items,ex){ex=ex||[];return items.map(x=>{
 let p=[...new Set(items.filter(y=>y.k===x.k).map(y=>y.a))].filter(z=>z!==x.a);
 if(p.length<3){const e=ex.filter(w=>w!==x.a&&!p.includes(w)&&(x.k==='n')===/^\d+$/.test(w));p=p.concat(shuf(e))}
 if(p.length<3&&x.k==='n'){const n=+x.a;[n+1,n-1,n+10,n-10,n+100].forEach(v=>{if(!p.includes(String(v)))p.push(String(v))})}
 if(p.length<3)p=p.concat(shuf(items.map(y=>y.a).filter(z=>z!==x.a&&!p.includes(z))));
 p=[...new Set(p)];if(p.length<3)return null;
 const o=shuf([x.a,...shuf(p).slice(0,3)]);return{q:x.q,o,c:o.indexOf(x.a)}}).filter(Boolean)}

function notesItems(t){const it=[],V=new Set(),cl=w=>w.replace(/^[^\wÁÉÍÓÚÑáéíóúñü]+|[^\wÁÉÍÓÚÑáéíóúñü]+$/g,'');
 t.replace(/([.!?])\s+/g,'$1\n').split('\n').map(l=>l.replace(/^[-•*\d.)\s]+/,'').trim()).filter(l=>l.length>=25).forEach(s=>{
  const ws=s.split(/\s+/).map(cl);ws.forEach(w=>{if(/^\d{2,}$/.test(w)||(w.length>=5&&!STOP.has(w.toLowerCase())))V.add(w)});
  let m=s.match(/^(.{2,60}?)\s*(?::|=| - | – )\s*(.{3,})$/);
  if(m){it.push({k:'d',q:'Según tus apuntes, ¿qué es «'+m[1]+'»?',a:m[2].replace(/[.;]$/,'')});return}
  m=s.match(/^(?:El |La |Los |Las |Un |Una )?(.{3,50}?)\s+(?:es|son|se define como|se denomina|se llama|significa|consiste en)\s+(.{12,110}?)\.?$/);
  if(m){it.push({k:'d',q:'Según tus apuntes, ¿qué se dice de «'+m[1]+'»?',a:m[2]});return}
  if(ws.length<6)return;
  let best=null,pr=9;ws.forEach((w,i)=>{if(i===0||w.length<4)return;
   const p=/^\d{2,}$/.test(w)?1:/^[A-ZÁÉÍÓÚÑ]/.test(w)?2:(w.length>=7&&!STOP.has(w.toLowerCase())?3:9);
   if(p<pr||(p===pr&&best&&w.length>best.length)){pr=p;best=w}});
  if(best)it.push({k:pr===1?'n':pr===2?'p':'h',q:'Completa: '+s.replace(best,'_____'),a:best})});
 return{items:it.slice(0,40),ex:[...V]}}
function bulkItems(t){return t.split(/\n\s*\n/).map(b=>{const o=[];let q='',r=-1;
 b.split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>{let m;
  if(m=l.match(/^respuesta\s*:\s*([a-d])/i))r='abcd'.indexOf(m[1].toLowerCase());
  else if(m=l.match(/^([a-d])[\)\.]\s*(.+)/i))o['abcd'.indexOf(m[1].toLowerCase())]=m[2];

function binar(g,w,h){const W=w+1,I=new Float64Array(W*(h+1)),o=new Uint8Array(w*h),k=Math.max(10,w>>5);
 for(let y=0;y<h;y++){let r=0;for(let x=0;x<w;x++){r+=g[y*w+x];I[(y+1)*W+x+1]=I[y*W+x+1]+r}}
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const x1=Math.max(0,x-k),x2=Math.min(w-1,x+k),y1=Math.max(0,y-k),y2=Math.min(h-1,y+k),n=(x2-x1+1)*(y2-y1+1),s=I[(y2+1)*W+x2+1]-I[y1*W+x2+1]-I[(y2+1)*W+x1]+I[y1*W+x1];o[y*w+x]=g[y*w+x]<s/n*0.85?0:255}
 return o}

 for(let i=0,j=0;i<p.length;i+=4,j++)g[j]=.299*p[i]+.587*p[i+1]+.114*p[i+2];
 const b=binar(g,w,h);for(let i=0,j=0;i<p.length;i+=4,j++)p[i]=p[i+1]=p[i+2]=b[j];x.putImageData(d,0,0);return c}

async function readDoc(f){const st=$('#err');st.style.color='var(--mu)';st.textContent='Leyendo archivo…';

 catch(e){st.style.color='';st.textContent=e===1?'No he encontrado texto. Si el PDF es un escaneo, usa las fotos.':'No se pudo leer el archivo. Comprueba la conexión.'}}

function tick(){const t=ui.t;if(!t||!t.run)return;t.left=Math.max(0,Math.round((t.end-Date.now())/1000));const e=$('#tm');if(e)e.textContent=fmt(t.left);
 if(t.left===0){t.run=false;clearInterval(TI);S.mins=S.mins||{};S.mins[today()]=(S.mins[today()]||0)+t.dur;touch();save();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(x){}t.left=t.dur*60;if(ui.tab==='home')render();modal('<h3>⏱ ¡Sesión terminada!</h3><p>Has sumado '+t.dur+' minutos de estudio. Haz un descanso.</p><div class="bar"><button class="btn" data-a="fcancel">Vale</button></div>')}}
function genFlash(){const er=m=>{$('#err').textContent=m};const r=notesItems($('#ta').value);if(r.items.length<2)return er('Necesito más texto: pega al menos 2 frases completas.');
 const have=new Set(S.cards.map(c=>c.q));let n=0;const dkk=(($('#at')||{}).value||'').trim();r.items.forEach(x=>{const q=x.q.replace('Según tus apuntes, ¿qué','¿Qué');if(have.has(q))return;have.add(q);S.cards.push({id:uid(),q,a:x.a,deck:dkk,known:null});n++});
 save();closeM();ui.tab='cards';ui.only=false;ui.ci=0;ui.flip=false;render();window.scrollTo(0,0);toast('Se han creado '+n+' tarjetas. Revísalas y borra las que no valgan.')}
function act(a,id){
 const T=()=>S.tasks.find(x=>x.id===id);
 switch(a){
 case'tab':ui.tab=id;ui.play=null;ui.draft=null;ui.flip=false;render();window.scrollTo(0,0);break;
 case'fsave':if(FS)FS();break;
 case'fcancel':closeM();break;
 case'toggle':T().done=!T().done;if(T().done)touch();save();render();break;
 case'newTask':taskForm();break;case'editTask':taskForm(id);break;
 case'delTask':ask('¿Eliminar esta tarea?',()=>{S.tasks=S.tasks.filter(x=>x.id!==id)});break;
 case'newExam':examForm();break;case'editExam':examForm(id);break;
 case'delExam':ask('¿Eliminar este examen?',()=>{S.exams=S.exams.filter(x=>x.id!==id)});break;
 case'newQuiz':ui.draft={id:uid(),title:'',questions:[blankQ()],isNew:true};render();window.scrollTo(0,0);break;
 case'editQuiz':ui.draft=JSON.parse(JSON.stringify(S.quizzes.find(x=>x.id===id)));render();window.scrollTo(0,0);break;
 case'delQuiz':ask('¿Eliminar este test?',()=>{S.quizzes=S.quizzes.filter(x=>x.id!==id)});break;
 case'addQ':ui.draft.questions.push(blankQ());render();break;
 case'delQ':if(ui.draft.questions.length>1){ui.draft.questions.splice(+id,1);render()}else{$('#err2').textContent='El test necesita al menos una pregunta.'}break;
 case'cancelDraft':ui.draft=null;render();break;
 case'saveQuiz':{const d=ui.draft;let er='';
  if(!d.title.trim())er='Escribe un título para el test.';
  else if(d.questions.some(q=>!q.q.trim()||q.o.some(o=>!o.trim())))er='Cada pregunta necesita enunciado y las cuatro respuestas.';
  if(er){$('#err2').textContent=er;break}
  const q={id:d.id,title:d.title.trim(),questions:d.questions.map(x=>({q:x.q.trim(),o:x.o.map(o=>o.trim()),c:x.c}))};
  const i=S.quizzes.findIndex(x=>x.id===q.id);if(i>=0)S.quizzes[i]=q;else S.quizzes.push(q);
  ui.draft=null;save();render();break}
 case'playQuiz':{const qz=S.quizzes.find(x=>x.id===id);ui.play={quiz:{id:qz.id,title:qz.title,questions:shuf(qz.questions.map(q=>{const o=shuf(q.o.map((t,i)=>[t,i]));return{q:q.q,o:o.map(x=>x[0]),c:o.findIndex(x=>x[1]===q.c)}}))},i:0,sel:null,answers:[],done:false}};render();window.scrollTo(0,0);break;
 case'pick':ui.play.sel=+id;render();break;
 case'next':{const p=ui.play;p.answers[p.i]=p.sel;p.sel=null;if(p.i===p.quiz.questions.length-1)finishQuiz(p);else p.i++;render();window.scrollTo(0,0);break}
 case'exitQuiz':ui.play=null;render();break;
 case'flip':ui.flip=!ui.flip;render();break;
 case'know':mark(true);render();break;case'review':mark(false);render();break;
 case'nextC':ui.ci=(ui.ci+1)%cq().length;ui.flip=false;render();break;
 case'prevC':ui.ci=(ui.ci-1+cq().length)%cq().length;ui.flip=false;render();break;
 case'newCard':cardForm();break;case'editCard':cardForm(id);break;
 case'delCard':ask('¿Eliminar esta tarjeta?',()=>{S.cards=S.cards.filter(x=>x.id!==id)});break;
 case'delRes':ask('¿Eliminar este resultado?',()=>{S.results=S.results.filter(x=>x.id!==id)});break;
 case'genFlash':genFlash();break;case'say':say();break;case'shareQuiz':shareQuiz(id);break;case'resetC':ask('¿Reiniciar el estado de todas las tarjetas?',()=>{S.cards.forEach(c=>c.known=null);ui.ci=0;ui.flip=false},'Sí, reiniciar');break;case'flashAuto':autoModal();break;
 case'onlyToggle':ui.only=!ui.only;ui.ci=0;ui.flip=false;render();break;
 case'shufC':S.cards=shuf(S.cards);ui.ci=0;ui.flip=false;save();render();break;
 case'tstart':{const t=ui.t;t.run=true;t.end=Date.now()+t.left*1000;clearInterval(TI);TI=setInterval(tick,500);render();break}
 case'tpause':ui.t.run=false;clearInterval(TI);render();break;
 case'treset':ui.t.run=false;clearInterval(TI);ui.t.left=ui.t.dur*60;render();break;
 case'tdur':ui.t.dur=+id;ui.t.left=ui.t.dur*60;ui.t.run=false;clearInterval(TI);render();break;
 case'retryWrong':{const p=ui.play,f=p.quiz.questions.filter((q,i)=>p.answers[i]!==q.c);ui.play={retry:true,quiz:{id:p.quiz.id,title:p.quiz.title,questions:shuf(f.map(q=>{const o=shuf(q.o.map((t,i)=>[t,i]));return{q:q.q,o:o.map(x=>x[0]),c:o.findIndex(x=>x[1]===q.c)}}))},i:0,sel:null,answers:[],done:false};render();window.scrollTo(0,0);break}
 case'auto':autoModal();break;case'genCards':gen('c');break;case'genNotes':gen('n');break;case'genBulk':gen('b');break;
 case'backup':backupModal();break;case'restore':restoreModal();break;case'doRestore':doRestore();break;case'dl':dl();break;case'cp':cp();break;
 case'clearAll':ask('¿Borrar todos tus datos? No se puede deshacer.',()=>{S=demo();ui.ci=0},'Sí, borrar todo');break;
 }}
document.addEventListener('click',e=>{
 if(e.target.id==='modal'){closeM();return}
 const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset.id)});
const sync=e=>{const t=e.target,f=t.dataset&&t.dataset.f,d=ui.draft;if(!f||!d)return;
 if(f==='title')d.title=t.value;
 else if(f==='q')d.questions[+t.dataset.i].q=t.value;
 else if(f==='o')d.questions[+t.dataset.i].o[+t.dataset.j]=t.value;
 else if(f==='c')d.questions[+t.dataset.i].c=+t.dataset.j};
document.addEventListener('input',sync);document.addEventListener('change',sync);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();
 if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('fc')){e.preventDefault();act('flip')}});
(function(){let t;try{t=localStorage.getItem('studyflow:theme')}catch(e){}if(t)document.documentElement.dataset.theme=t;
$('#th').addEventListener('click',()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('studyflow:theme',n)}catch(e){}})})();
load();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
